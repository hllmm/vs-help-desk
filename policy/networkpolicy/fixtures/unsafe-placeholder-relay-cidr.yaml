apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-mail-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.30.0/24
      ports:
        - port: 587
          protocol: TCP
