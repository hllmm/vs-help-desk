apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-mail-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.100.10/32
      ports:
        - port: 993
          protocol: TCP
