apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-relay-egress
  annotations:
    vshelpdesk.io/policy-provenance: task-7-mail-egress-generator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
      ports:
        - port: 587
          protocol: TCP
