# Preserve original X-Forwarded-Proto from edge/Ingress; fallback to $scheme if absent.
# 2-hop chain: edge -> web nginx -> API. Map must be in http context (this file is included inside http).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+" $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve service names when containers recreate.
    # Without a variable, nginx freezes the API IP at start and returns 404/502
    # after `api` restarts with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Local health for container checks (not the API)
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Legacy API liveness alias (exact path — not covered by /health/)
    location = /health {
        set $api_upstream api:8080;
        # No URI suffix: with variables, nginx must pass the original request URI.
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API + health proxy to the ASP.NET container
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 25m;
    }

    location /health/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
