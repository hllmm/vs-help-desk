apiVersion: batch/v1
kind: CronJob
metadata:
  name: process-incoming-emails
  labels:
    app.kubernetes.io/name: process-incoming-emails
    app.kubernetes.io/part-of: vs-help-desk
    app.kubernetes.io/component: jobs
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: process-incoming-emails
            app.kubernetes.io/part-of: vs-help-desk
            app.kubernetes.io/component: jobs
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.13.0@sha256:d43bdb28bae0be0998f3be83199bfb2b81e0a30b034b6d7586ce7e05de34c3fd
              imagePullPolicy: IfNotPresent
              env:
                - name: JOBS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vshelpdesk-secrets
                      key: JOBS_API_KEY
              command: ["sh", "-c"]
              args:
                - curl -fsS -X POST "http://api:8080/api/jobs/process-incoming-emails" -H "X-Jobs-Api-Key: ${JOBS_API_KEY}"
