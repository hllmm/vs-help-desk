# WARNING: Do NOT apply this file as-is.
# It is a documentation sample only. Real secrets must never be committed.
#
# Create the real secret out-of-band, for example:
#
#   kubectl create secret generic vshelpdesk-secrets \
#     --namespace=vshelpdesk \
#     --from-literal=POSTGRES_PASSWORD='change-me' \
#     --from-literal=AUTH_SIGNING_KEY='change-me-min-32-bytes-long!!!!' \
#     --from-literal=JOBS_API_KEY='change-me-min-16' \
#     --from-literal=ConnectionStrings__DefaultConnection='Host=postgres;Port=5432;Database=VS_HelpDesk_DB;Username=stajyer;Password=change-me'
#
# Prefer a single ConnectionStrings__DefaultConnection value (full connection string)
# over composing password pieces in the Deployment env.
#
# Optional email keys (include only if used in your environment):
#   EMAIL_SMTP_PASSWORD, EMAIL_IMAP_PASSWORD
#   EMAIL_SMTP_USERNAME, EMAIL_IMAP_USERNAME, EMAIL_IMAP_ACCOUNT_ID
#   EMAIL_SMTP_HOST, EMAIL_IMAP_HOST, EMAIL_SUPPORT
#
# Real secret file name to use locally (gitignored): secret.yaml
# Do not list this example in kustomization.yaml resources.

apiVersion: v1
kind: Secret
metadata:
  name: vshelpdesk-secrets
  labels:
    app.kubernetes.io/name: vshelpdesk-secrets
    app.kubernetes.io/part-of: vs-help-desk
type: Opaque
stringData:
  # Required
  POSTGRES_PASSWORD: "CHANGE_ME"
  AUTH_SIGNING_KEY: "CHANGE_ME_MIN_32_BYTES_LONG_!!!!!!!!"
  JOBS_API_KEY: "CHANGE_ME_MIN_16_CHARS"
  # Full connection string preferred (Host=postgres for in-cluster Service DNS)
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=VS_HelpDesk_DB;Username=stajyer;Password=CHANGE_ME"

  # Optional — email (passwords / credentials)
  # EMAIL_SMTP_PASSWORD: "CHANGE_ME"
  # EMAIL_IMAP_PASSWORD: "CHANGE_ME"
  # EMAIL_SMTP_USERNAME: "support@example.local"
  # EMAIL_IMAP_USERNAME: "support@example.local"
  # EMAIL_IMAP_ACCOUNT_ID: "primary"
  # EMAIL_SMTP_HOST: "smtp.example.local"
  # EMAIL_IMAP_HOST: "imap.example.local"
  # EMAIL_SUPPORT: "support@example.local"
