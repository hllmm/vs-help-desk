# WARNING: Do NOT apply this file as-is.
# It is a documentation sample only. Real secrets must never be committed.
#
# Create the real secret out-of-band, for example:
#
#   kubectl create secret generic vshelpdesk-secrets \
#     --namespace=vshelpdesk \
#     --from-literal=POSTGRES_PASSWORD='change-me' \
#     --from-literal=AUTH_SIGNING_KEY='change-me-min-32-bytes-long!!!!' \
#     --from-literal=JOBS_API_KEY='change-me-min-16' \
#     --from-literal=ConnectionStrings__DefaultConnection='Host=postgres;Port=5432;Database=VS_HelpDesk_DB;Username=stajyer;Password=change-me' \
#     --from-literal=Email__ImapUsername='support@example.local' \
#     --from-literal=Email__ImapPassword='change-me' \
#     --from-literal=Email__ImapAccountId='primary' \
#     --from-literal=Email__SmtpUsername='support@example.local' \
#     --from-literal=Email__SmtpPassword='change-me'
#
# Prefer a single ConnectionStrings__DefaultConnection value (full connection string)
# over composing password pieces in the Deployment env.
#
# --- Key naming (ops must match api-deployment.yaml) ---
# Postgres / compose-style keys (used by StatefulSet + CronJobs; remapped for ASP.NET Auth/Jobs):
#   AUTH_SIGNING_KEY  → Deployment remaps to Auth__SigningKey   (ASP.NET Auth:SigningKey)
#   JOBS_API_KEY      → Deployment remaps to Jobs__ApiKey       (ASP.NET Jobs:ApiKey)
#   POSTGRES_PASSWORD → used by Postgres StatefulSet
#
# App settings injected as-is via secretRef envFrom (ASP.NET double-underscore names):
#   ConnectionStrings__DefaultConnection  → ConnectionStrings:DefaultConnection
#   Email__ImapUsername / Email__ImapPassword / Email__ImapAccountId
#   Email__SmtpUsername / Email__SmtpPassword
#   Email__SupportMailboxAddress is configured in the non-secret ConfigMap.
#   Branding/contact values are also in the ConfigMap; LogoUrl is optional.
#
# Do NOT rename AUTH_SIGNING_KEY / JOBS_API_KEY unless you also change
# api-deployment.yaml secretKeyRef keys (and CronJobs that read JOBS_API_KEY).
#
# Email hosts (Email__SmtpHost / Email__ImapHost) live in ConfigMap vshelpdesk-config
# as replace-me placeholders — Production ValidateOnStart requires them (SmtpHost always;
# ImapHost + IMAP credentials when Email__ReceiverMode=Imap, the ConfigMap default).
#
# Real secret file name to use locally (gitignored): secret.yaml
# Do not list this example in kustomization.yaml resources.

apiVersion: v1
kind: Secret
metadata:
  name: vshelpdesk-secrets
  labels:
    app.kubernetes.io/name: vshelpdesk-secrets
    app.kubernetes.io/part-of: vs-help-desk
type: Opaque
stringData:
  # Required
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Mapped by api Deployment → Auth__SigningKey (min 32 UTF-8 bytes)
  AUTH_SIGNING_KEY: "CHANGE_ME_MIN_32_BYTES_LONG_!!!!!!!!"
  # Mapped by api Deployment → Jobs__ApiKey (min 16 chars); CronJobs read this key as-is
  JOBS_API_KEY: "CHANGE_ME_MIN_16_CHARS"
  # Full connection string preferred (Host=postgres for in-cluster Service DNS)
  # Injected as-is into the api container (ASP.NET ConnectionStrings:DefaultConnection)
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=VS_HelpDesk_DB;Username=stajyer;Password=CHANGE_ME"

  # Required when ConfigMap Email__ReceiverMode=Imap (Production default) — ValidateOnStart
  # Keys use ASP.NET env binding names (Email__* → Email:*); envFrom injects them as-is.
  Email__ImapUsername: "support@example.local"
  Email__ImapPassword: "CHANGE_ME"
  Email__ImapAccountId: "primary"
  # Recommended for outbound SMTP (not always validated on start, but needed to send mail)
  Email__SmtpUsername: "support@example.local"
  Email__SmtpPassword: "CHANGE_ME"
