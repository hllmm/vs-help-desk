# Kubernetes-specific nginx config for the web image.
# Image-baked frontend/nginx.conf uses Docker DNS (resolver 127.0.0.11 + variables).
# That resolver does not exist in-cluster. Option A: static proxy_pass to Service
# hostname `api` — ClusterIP is stable; kube-proxy updates Endpoints when pods change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-config
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: vs-help-desk
data:
  default.conf: |
    # Preserve original X-Forwarded-Proto from Ingress/edge; fallback to $scheme.
    # 2-hop chain: edge -> web nginx -> API. Map must be in http context.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~.+" $http_x_forwarded_proto;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Local health for container checks (not the API)
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Legacy API liveness alias (exact path — not covered by /health/)
        location = /health {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # API + health proxy to the ASP.NET Service (same-origin via Ingress → web)
        location /api/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            client_max_body_size 25m;
        }

        location /health/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
