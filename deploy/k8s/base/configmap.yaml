apiVersion: v1
kind: ConfigMap
metadata:
  name: vshelpdesk-config
  labels:
    app.kubernetes.io/name: vshelpdesk-config
    app.kubernetes.io/part-of: vs-help-desk
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  AllowedHosts: "helpdesk.example.local"
  SeedUser__Enabled: "false"
  SeedAdmin__Enabled: "false"
  FileStorage__RootPath: "/var/vshelpdesk/attachments"
  POSTGRES_USER: "stajyer"
  POSTGRES_DB: "VS_HelpDesk_DB"
  Email__ReceiverMode: "Imap"
  # Replace-me hosts — Production ValidateOnStart requires non-empty SmtpHost always
  # and ImapHost when ReceiverMode=Imap. Ops MUST replace with company SMTP/IMAP hosts
  # before real traffic (empty values fail API start).
  Email__SmtpHost: "smtp.example.local"
  Email__ImapHost: "imap.example.local"
  Email__SmtpPort: "587"
  Email__SmtpSecurityMode: "StartTls"
  Email__ImapPort: "993"
  Email__ImapSecurityMode: "SslOnConnect"
  Email__ImapFolder: "INBOX"
  Email__TrustedAuthServId: "mx.example.local"
  Email__SupportMailboxAddress: "support@example.local"
  Email__SupportMailboxDisplayName: "VS Help Desk"
  # Corporate theme; LogoUrl is optional and must be HTTPS when set.
  EmailBranding__CompanyName: "VS Help Desk"
  EmailBranding__SystemName: "Corporate Customer Support System"
  EmailBranding__LogoUrl: ""
  EmailBranding__RequireLogo: "false"
  EmailBranding__WebsiteUrl: ""
  EmailBranding__Address: ""
  EmailBranding__SupportEmail: "support@example.local"
  EmailBranding__SupportPhone: ""
  EmailBranding__PrimaryColor: "#2563eb"
  EmailBranding__HeaderGradientStart: "#1e293b"
  EmailBranding__HeaderGradientEnd: "#0f172a"
  EmailBranding__FooterText: "© 2026 VS Help Desk. All rights reserved."
  # Passwords / usernames / account id: Secret vshelpdesk-secrets (Email__* keys)
