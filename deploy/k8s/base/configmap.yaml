apiVersion: v1
kind: ConfigMap
metadata:
  name: vshelpdesk-config
  labels:
    app.kubernetes.io/name: vshelpdesk-config
    app.kubernetes.io/part-of: vs-help-desk
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  SeedUser__Enabled: "false"
  SeedAdmin__Enabled: "false"
  ReverseProxy__ForwardLimit: "2"
  # Replace with the actual ingress/web pod network when the cluster differs.
  ReverseProxy__KnownNetworks__0: "10.244.0.0/16"
  FileStorage__RootPath: "/var/vshelpdesk/attachments"
  FileStorage__AllowedContentTypes__0: "application/pdf"
  FileStorage__AllowedContentTypes__1: "image/png"
  FileStorage__AllowedContentTypes__2: "image/jpeg"
  FileStorage__AllowedContentTypes__3: "image/gif"
  FileStorage__AllowedContentTypes__4: "image/webp"
  FileStorage__AllowedContentTypes__5: "text/plain"
  POSTGRES_USER: "stajyer"
  POSTGRES_DB: "VS_HelpDesk_DB"
  Email__ReceiverMode: "Imap"
  # Replace-me hosts — Production ValidateOnStart requires non-empty SmtpHost always
  # and ImapHost when ReceiverMode=Imap. Ops MUST replace with company SMTP/IMAP hosts
  # before real traffic (empty values fail API start).
  Email__SmtpHost: "smtp.example.local"
  Email__ImapHost: "imap.example.local"
  Email__SmtpPort: "587"
  Email__SmtpSecurityMode: "StartTls"
  Email__ImapPort: "993"
  Email__ImapSecurityMode: "SslOnConnect"
  Email__ImapFolder: "INBOX"
  Email__MaxUnreadBatchSize: "25"
  Email__MaxMessageSizeBytes: "26214400"
  Email__MaxAttachmentsPerMessage: "10"
  Email__MaxTotalAttachmentBytesPerMessage: "20971520"
  # Passwords / usernames / account id: Secret vshelpdesk-secrets (Email__* keys)
