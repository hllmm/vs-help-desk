apiVersion: v1
kind: ConfigMap
metadata:
  name: vshelpdesk-config
  labels:
    app.kubernetes.io/name: vshelpdesk-config
    app.kubernetes.io/part-of: vs-help-desk
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  SeedUser__Enabled: "false"
  FileStorage__RootPath: "/var/vshelpdesk/attachments"
  POSTGRES_USER: "stajyer"
  POSTGRES_DB: "VS_HelpDesk_DB"
  Email__ReceiverMode: "Imap"
  # Replace-me hosts — Production ValidateOnStart requires non-empty SmtpHost always
  # and ImapHost when ReceiverMode=Imap. Ops MUST replace with company SMTP/IMAP hosts
  # before real traffic (empty values fail API start).
  Email__SmtpHost: "smtp.example.local"
  Email__ImapHost: "imap.example.local"
  Email__SmtpPort: "587"
  Email__SmtpSecurityMode: "StartTls"
  Email__ImapPort: "993"
  Email__ImapSecurityMode: "SslOnConnect"
  Email__ImapFolder: "INBOX"
  # Passwords / usernames / account id: Secret vshelpdesk-secrets (Email__* keys)
