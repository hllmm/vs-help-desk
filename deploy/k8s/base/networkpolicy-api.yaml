apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow
  labels:
    app.kubernetes.io/part-of: vs-help-desk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # web -> api
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - port: 8080
          protocol: TCP
    # jobs CronJobs -> api (curl image)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: jobs
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # api -> postgres
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # SMTP/IMAP to controlled mail relays (environment-specific CIDRs).
    # Do NOT use 0.0.0.0/0. Ops must set MailRelayCIDR per env (e.g., 10.20.30.0/24).
    - to:
        - ipBlock:
            cidr: 10.20.30.0/24
      ports:
        - port: 587
          protocol: TCP
        - port: 993
          protocol: TCP
        - port: 25
          protocol: TCP
    # Alternative: if mail relay is a single IP, use /32
    - to:
        - ipBlock:
            cidr: 192.168.100.10/32
      ports:
        - port: 587
          protocol: TCP
        - port: 993
          protocol: TCP
