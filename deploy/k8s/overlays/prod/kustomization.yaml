apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Image tags for company registry. Replace newName with your registry path, e.g.:
#   newName: registry.example.local/vshelpdesk-api
#   newTag: "1.0.0"
# Base manifests use vshelpdesk-api:local / vshelpdesk-web:local; this transformer
# rewrites name+tag for prod pulls.
images:
  - name: vshelpdesk-api
    newName: vshelpdesk-api
    newTag: "latest"
  - name: vshelpdesk-web
    newName: vshelpdesk-web
    newTag: "latest"
patches:
  - path: ingress-patch.yaml
