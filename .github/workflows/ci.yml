name: CI

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run the 100k-ticket, 20-VU ticket-read load profile (manual only)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_DB;Username=stajyer;Password=ci_postgres_password
      Auth__SigningKey: ci-signing-key-with-at-least-32-bytes!!
      Jobs__ApiKey: ci-jobs-api-key-32-characters!!
      SeedUser__Enabled: "true"
      SeedUser__Password: CiSeedPassword123!
      SeedUser__Username: support
      SeedUser__FullName: CI Support
      SeedUser__Email: support@vshelpdesk.local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Check vulnerable packages
        run: dotnet list VSHelpDesk.slnx package --vulnerable --include-transitive | tee /tmp/vuln.txt && ! grep -qi "has the following vulnerable" /tmp/vuln.txt
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Test
        run: dotnet test VSHelpDesk.slnx --no-build -c Release --nologo

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - name: Bundle budget (JS <= 120 KiB gzip, CSS <= 15 KiB gzip)
        run: env -u VITE_API_BASE_URL npm run build:budget
      - name: Bundle budget checker tests
        run: node --test scripts/check-bundle-budget.test.mjs

  dockerfile-policy:
    name: Dockerfile pin policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check Dockerfile pins and package upgrades
        run: bash scripts/check-dockerfile-pins.sh
      - name: Test Dockerfile pin checker fixtures
        run: bash scripts/test-dockerfile-pins.sh

  kustomize:
    name: Kustomize validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate kustomize build
        run: |
          kubectl kustomize deploy/k8s/base >/dev/null
          kubectl kustomize deploy/k8s/overlays/prod >/dev/null
      - name: Install pinned Conftest
        run: bash scripts/install-conftest.sh .tools/conftest
      - name: Verify NetworkPolicy policy fixtures
        run: bash scripts/check-networkpolicy-policy.sh
      - name: Enforce immutable production images
        run: |
          # The checked-in overlay intentionally retains local images and must
          # never be accepted as a deployable production manifest.
          if kubectl kustomize deploy/k8s/overlays/prod | bash scripts/check-prod-manifest.sh; then
            echo "unrendered production overlay must fail structured image validation" >&2
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_prod_manifest_policy.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_render_prod_manifest.py

  e2e-real:
    name: Real API E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_E2E
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_E2E"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_E2E;Username=stajyer;Password=ci_postgres_password
      Auth__SigningKey: ci-e2e-signing-key-with-at-least-32-bytes!!
      Auth__Issuer: VSHelpDesk
      Auth__Audience: VSHelpDesk
      Auth__ExpirationMinutes: "60"
      Jobs__ApiKey: ci-e2e-jobs-api-key-32-characters!!
      Email__ReceiverMode: Fake
      Email__SmtpHost: localhost
      Email__SmtpPort: "1025"
      Email__SmtpSecurityMode: None
      Email__SupportMailboxAddress: support@example.test
      Email__TrustedAuthServId: mx.test
      SeedUser__Enabled: "true"
      SeedUser__Password: CiSeedPassword123!
      SeedUser__Username: support
      SeedUser__FullName: CI Support
      SeedUser__Email: support@vshelpdesk.local
      SeedAdmin__Enabled: "false"
      Cors__AllowedOrigins__0: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Start the Release API on 127.0.0.1:8080
        run: |
          nohup env \
            ASPNETCORE_ENVIRONMENT=Development \
            ASPNETCORE_URLS=http://127.0.0.1:8080 \
            ConnectionStrings__DefaultConnection="$ConnectionStrings__DefaultConnection" \
            Auth__SigningKey="$Auth__SigningKey" \
            Auth__Issuer="$Auth__Issuer" \
            Auth__Audience="$Auth__Audience" \
            Auth__ExpirationMinutes="$Auth__ExpirationMinutes" \
            Jobs__ApiKey="$Jobs__ApiKey" \
            Email__ReceiverMode="$Email__ReceiverMode" \
            Email__SmtpHost="$Email__SmtpHost" \
            Email__SmtpPort="$Email__SmtpPort" \
            Email__SmtpSecurityMode="$Email__SmtpSecurityMode" \
            Email__SupportMailboxAddress="$Email__SupportMailboxAddress" \
            Email__TrustedAuthServId="$Email__TrustedAuthServId" \
            SeedUser__Enabled="$SeedUser__Enabled" \
            SeedUser__Password="$SeedUser__Password" \
            SeedUser__Username="$SeedUser__Username" \
            SeedUser__FullName="$SeedUser__FullName" \
            SeedUser__Email="$SeedUser__Email" \
            SeedAdmin__Enabled="$SeedAdmin__Enabled" \
            Cors__AllowedOrigins__0="$Cors__AllowedOrigins__0" \
            dotnet run --project src/VSHelpDesk.WebAPI -c Release --no-build --no-launch-profile \
            > api.log 2>&1 &
          echo "API starting (pid $!)"
      - name: Wait for /health (max 60 seconds)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "API healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60 seconds"
          cat api.log
          exit 1
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install Chromium
        run: |
          cd frontend
          npx playwright install chromium --with-deps
      - name: Run real API Playwright E2E
        run: |
          cd frontend
          npx playwright test --config=playwright.config.real.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-real-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/blob-report/
          if-no-files-found: warn
      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-logs-e2e-real
          path: api.log
          if-no-files-found: warn
      - name: Stop the API
        if: always()
        run: pkill -f "VSHelpDesk.WebAPI" || true

  production-security-smoke:
    name: Production TLS authentication smoke
    runs-on: ubuntu-latest
    env:
      CI: "true"
      Auth__SigningKey: ci-production-security-smoke-signing-key-with-at-least-32-bytes!!
      Jobs__ApiKey: ci-production-security-smoke-jobs-api-key-32-characters!!
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Check Production TLS smoke contract
        run: bash scripts/test-production-security-smoke.sh
      - name: Run Production TLS security smoke
        run: bash scripts/run-production-security-smoke.sh
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/vshd-production-security-smoke
      - name: Upload Production TLS smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-security-smoke-evidence
          path: ${{ runner.temp }}/vshd-production-security-smoke/
          if-no-files-found: warn

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.0"
      - name: Check markdown links
        run: node scripts/check-markdown-links.mjs

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build API image
        run: docker build -t vshelpdesk:api -f Dockerfile .
      - name: Build frontend image
        run: docker build -t vshelpdesk:frontend -f frontend/Dockerfile ./frontend
      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: vshelpdesk:api
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: vshelpdesk:frontend
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

  query-contract:
    name: Backend query contract (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_CI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_CI"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_CI;Username=stajyer;Password=ci_postgres_password
      Auth__SigningKey: ci-signing-key-with-at-least-32-bytes!!
      Jobs__ApiKey: ci-jobs-api-key-32-characters!!
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Application tests
        run: dotnet test tests/VSHelpDesk.Application.UnitTests --no-build -c Release --nologo
      - name: Infrastructure tests (real PostgreSQL)
        run: dotnet test tests/VSHelpDesk.Infrastructure.UnitTests --no-build -c Release --nologo
      - name: WebAPI integration tests
        run: dotnet test tests/VSHelpDesk.WebAPI.IntegrationTests --no-build -c Release --nologo
      - name: Generate idempotent migration script
        run: >-
          dotnet ef migrations script --idempotent
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
          --output /tmp/query-contract-migrations.sql
      - name: Assert read-path indexes exist in the script
        run: |
          set -e
          expected=(
            "pg_trgm"
            "IX_Tickets_LastActivityAt_TicketNumber"
            "IX_Tickets_Status_LastActivityAt_TicketNumber"
            "IX_Tickets_Status_WaitingCustomerSince_Id"
            "IX_Tickets_TicketNumber_Trgm"
            "IX_Tickets_Subject_Trgm"
            "IX_Tickets_CustomerName_Trgm"
            "IX_Tickets_CustomerEmail_Trgm"
            "IX_TicketMessages_TicketId_CreatedAt_Id"
            "IX_TicketAttachments_TicketMessageId_CreatedAt_Id"
          )
          for name in "${expected[@]}"; do
            if ! grep -q "$name" /tmp/query-contract-migrations.sql; then
              echo "Missing expected schema artifact in migration SQL: $name"
              exit 1
            fi
          done
          echo "All ${#expected[@]} read-path schema artifacts are present."

  sqlite-migration-smoke:
    name: SQLite smoke (EnsureCreated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Restore SQLite smoke tool
        run: dotnet restore tools/SqliteSmoke/SqliteSmoke.csproj
      - name: Build SQLite smoke tool
        run: dotnet build tools/SqliteSmoke/SqliteSmoke.csproj -c Release --no-restore
      - name: Run SQLite smoke (EnsureCreated)
        run: dotnet run --project tools/SqliteSmoke --configuration Release --no-build
      - name: Verify SQLite database file
        run: test -f /tmp/sqlite-smoke.db && ls -lh /tmp/sqlite-smoke.db && echo "SQLite smoke DB created via EnsureCreated"

  performance:
    name: Manual ticket-read load profile (100k fixture)
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_Perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_Perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_Perf;Username=stajyer;Password=ci_postgres_password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.0"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Seed the 100k-ticket guard-railed fixture
        run: >-
          PGPASSWORD=ci_postgres_password psql
          --host localhost --port 5432 --username stajyer
          --dbname VS_HelpDesk_Perf --file performance/seed-ticket-read.sql
      - name: Start the Release API
        run: |
          nohup env \
            ASPNETCORE_ENVIRONMENT=Production \
            ASPNETCORE_URLS=http://127.0.0.1:8080 \
            ConnectionStrings__DefaultConnection="$ConnectionStrings__DefaultConnection" \
            Auth__SigningKey=ci-perf-signing-key-with-at-least-32-bytes \
            Jobs__ApiKey=ci-perf-jobs-api-key-32-characters \
            SeedUser__Enabled=false \
            SeedAdmin__Enabled=false \
            Email__ReceiverMode=Imap \
            Email__SmtpHost=127.0.0.1 \
            Email__SmtpPort=2525 \
            Email__SmtpSecurityMode=StartTls \
            Email__ImapHost=127.0.0.1 \
            Email__ImapPort=3143 \
            Email__ImapSecurityMode=SslOnConnect \
            Email__ImapUsername=perf-unused \
            Email__ImapPassword=ci-perf-not-a-real-mailbox \
            Email__ImapAccountId=perf-unused \
            Email__SupportMailboxAddress=perf-support@example.invalid \
            dotnet run --project src/VSHelpDesk.WebAPI -c Release --no-build --no-launch-profile \
            > api.log 2>&1 &
          echo "API starting (pid $!)"
      - name: Wait for /health (max 60 seconds)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "API healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60 seconds"
          cat api.log
          exit 1
      - name: Run the 20-VU ticket-read load profile
        run: |
          set -o pipefail
          PERF_USERNAME=perf-admin \
          PERF_PASSWORD=local-perf-password \
          PERF_BASE_URL=http://127.0.0.1:8080 \
          PERF_VUS=20 \
          PERF_DURATION_SEC=60 \
          PERF_WARMUP_SEC=15 \
          node performance/ticket-read-load.mjs | tee perf-load-output.txt
          grep '^PERF_RESULT ' perf-load-output.txt | sed 's/^PERF_RESULT //' > ticket-read-performance.json
          test -s ticket-read-performance.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ticket-read-performance-json
          path: |
            ticket-read-performance.json
            perf-load-output.txt
          if-no-files-found: warn
      - name: Stop the API
        if: always()
        run: pkill -f "VSHelpDesk.WebAPI" || true
