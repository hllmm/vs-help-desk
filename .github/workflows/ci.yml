name: CI

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run the 100k-ticket, 20-VU ticket-read load profile (manual only)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_DB;Username=stajyer;Password=ci_postgres_password
      Auth__SigningKey: ci-signing-key-with-at-least-32-bytes!!
      Jobs__ApiKey: ci-jobs-api-key-32-characters!!
      SeedUser__Enabled: "true"
      SeedUser__Password: CiSeedPassword123!
      SeedUser__Username: support
      SeedUser__FullName: CI Support
      SeedUser__Email: support@vshelpdesk.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Test
        run: dotnet test VSHelpDesk.slnx --no-build -c Release --nologo

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Bundle budget (JS <= 120 KiB gzip, CSS <= 15 KiB gzip)
        run: env -u VITE_API_BASE_URL npm run build:budget
      - name: Bundle budget checker tests
        run: node --test scripts/check-bundle-budget.test.mjs

  kustomize:
    name: Kustomize validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate kustomize build
        run: |
          kubectl kustomize deploy/k8s/base >/dev/null
          kubectl kustomize deploy/k8s/overlays/prod >/dev/null

  query-contract:
    name: Backend query contract (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_CI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_CI"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_CI;Username=stajyer;Password=ci_postgres_password
      Auth__SigningKey: ci-signing-key-with-at-least-32-bytes!!
      Jobs__ApiKey: ci-jobs-api-key-32-characters!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Application tests
        run: dotnet test tests/VSHelpDesk.Application.UnitTests --no-build -c Release --nologo
      - name: Infrastructure tests (real PostgreSQL)
        run: dotnet test tests/VSHelpDesk.Infrastructure.UnitTests --no-build -c Release --nologo
      - name: WebAPI integration tests
        run: dotnet test tests/VSHelpDesk.WebAPI.IntegrationTests --no-build -c Release --nologo
      - name: Generate idempotent migration script
        run: >-
          dotnet ef migrations script --idempotent
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
          --output /tmp/query-contract-migrations.sql
      - name: Assert read-path indexes exist in the script
        run: |
          set -e
          expected=(
            "pg_trgm"
            "IX_Tickets_LastActivityAt_TicketNumber"
            "IX_Tickets_Status_LastActivityAt_TicketNumber"
            "IX_Tickets_Status_WaitingCustomerSince_Id"
            "IX_Tickets_TicketNumber_Trgm"
            "IX_Tickets_Subject_Trgm"
            "IX_Tickets_CustomerName_Trgm"
            "IX_Tickets_CustomerEmail_Trgm"
            "IX_TicketMessages_TicketId_CreatedAt_Id"
            "IX_TicketAttachments_TicketMessageId_CreatedAt_Id"
          )
          for name in "${expected[@]}"; do
            if ! grep -q "$name" /tmp/query-contract-migrations.sql; then
              echo "Missing expected schema artifact in migration SQL: $name"
              exit 1
            fi
          done
          echo "All ${#expected[@]} read-path schema artifacts are present."

  performance:
    name: Manual ticket-read load profile (100k fixture)
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stajyer
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: VS_HelpDesk_Perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stajyer -d VS_HelpDesk_Perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=VS_HelpDesk_Perf;Username=stajyer;Password=ci_postgres_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore
        run: dotnet restore VSHelpDesk.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build VSHelpDesk.slnx --no-restore -c Release
      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/VSHelpDesk.Infrastructure
          --startup-project src/VSHelpDesk.WebAPI
          --configuration Release
          --no-build
      - name: Seed the 100k-ticket guard-railed fixture
        run: >-
          PGPASSWORD=ci_postgres_password psql
          --host localhost --port 5432 --username stajyer
          --dbname VS_HelpDesk_Perf --file performance/seed-ticket-read.sql
      - name: Start the Release API
        run: |
          nohup env \
            ASPNETCORE_ENVIRONMENT=Production \
            ASPNETCORE_URLS=http://127.0.0.1:8080 \
            ConnectionStrings__DefaultConnection="$ConnectionStrings__DefaultConnection" \
            Auth__SigningKey=ci-perf-signing-key-with-at-least-32-bytes \
            Jobs__ApiKey=ci-perf-jobs-api-key-32-characters \
            SeedUser__Enabled=false \
            SeedAdmin__Enabled=false \
            Email__ReceiverMode=Imap \
            Email__SmtpHost=127.0.0.1 \
            Email__SmtpPort=2525 \
            Email__SmtpSecurityMode=StartTls \
            Email__ImapHost=127.0.0.1 \
            Email__ImapPort=3143 \
            Email__ImapSecurityMode=SslOnConnect \
            Email__ImapUsername=perf-unused \
            Email__ImapPassword=ci-perf-not-a-real-mailbox \
            Email__ImapAccountId=perf-unused \
            Email__SupportMailboxAddress=perf-support@example.invalid \
            dotnet run --project src/VSHelpDesk.WebAPI -c Release --no-build --no-launch-profile \
            > api.log 2>&1 &
          echo "API starting (pid $!)"
      - name: Wait for /health (max 60 seconds)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "API healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60 seconds"
          cat api.log
          exit 1
      - name: Run the 20-VU ticket-read load profile
        run: |
          set -o pipefail
          PERF_USERNAME=perf-admin \
          PERF_PASSWORD=local-perf-password \
          PERF_BASE_URL=http://127.0.0.1:8080 \
          PERF_VUS=20 \
          PERF_DURATION_SEC=60 \
          PERF_WARMUP_SEC=15 \
          node performance/ticket-read-load.mjs | tee perf-load-output.txt
          grep '^PERF_RESULT ' perf-load-output.txt | sed 's/^PERF_RESULT //' > ticket-read-performance.json
          test -s ticket-read-performance.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-read-performance-json
          path: |
            ticket-read-performance.json
            perf-load-output.txt
          if-no-files-found: warn
      - name: Stop the API
        if: always()
        run: pkill -f "VSHelpDesk.WebAPI" || true
