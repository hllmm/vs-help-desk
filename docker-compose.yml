services:
  postgres:
    image: postgres:16-alpine
    container_name: vshelpdesk_db
    environment:
      POSTGRES_USER: stajyer
      POSTGRES_PASSWORD: staj_sifre_123
      POSTGRES_DB: VS_HelpDesk_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: vshelpdesk_mail
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
