services:
  postgres:
    image: postgres:16-alpine
    container_name: vshelpdesk_db
    environment:
      POSTGRES_USER: stajyer
      # Prefer POSTGRES_PASSWORD from a local .env (see .env.example). Do not commit real secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staj_sifre_123}
      POSTGRES_DB: VS_HelpDesk_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: vshelpdesk_mail
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  greenmail:
    image: greenmail/standalone:2.1.11
    profiles: ["imap-test"]
    ports:
      - "3025:3025"
      - "3143:3143"
      - "8080:8080"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:test@vshelpdesk.test,customer:test@vshelpdesk.test
        -Dgreenmail.users.login=email
        -Dgreenmail.auth.disabled

volumes:
  postgres_data:
